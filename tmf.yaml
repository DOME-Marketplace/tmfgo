# ==============================================================================
# TM Forum API Server Configuration (tmf.yaml)
# ==============================================================================

# Indicates the environment (e.g., local, domedev, domepre, domepro, isbedev, isbepre, isbepro)
environment: "local"

# ProxyEnabled enables the TMF caching proxy functionality
proxyEnabled: false

# Information about the organization operating this server
serverOperatorOrganizationIdentifier: "VATES-A15456585"
serverOperatorDid: "did:elsi:VATES-A15456585"
serverOperatorName: "ALTIA CONSULTORES SA"
serverOperatorCountry: "ES"
serverEmailAddress: ""

# Powers required by callers to perform the operations
learPower:
  type: "domain"
  domain: "DOME"
  function: "Onboarding"
  action:
    - "execute"

productCreatePower:
  type: "domain"
  domain: "DOME"
  function: "ProductOffering"
  action:
    - "Create"

productUpdatePower:
  type: "domain"
  domain: "DOME"
  function: "ProductOffering"
  action:
    - "Update"

productDeletePower:
  type: "domain"
  domain: "DOME"
  function: "ProductOffering"
  action:
    - "Delete"

# Name of the file where user-defined authorization policies are stored
policyFileName: "auth_policies.star"

# The domain of the remote TMForum API server when acting as proxy
remoteTMFServer: "https://tmf.dome-marketplace-sbx.org"

# VerifierServer is the URL of the verifier server used to verify access tokens
verifierServer: "https://verifier.dome-marketplace-sbx.org"

# Database file where local TMForum data is stored (SQLite)
dbname: "data/tmf.lcl.db"

# Period in which the reporting tool will clone TMForum objects from upstream
clonePeriod: "10m"

# Hour and minute of the day when server automatically restarts (-1 disables)
restartHour: 3
restartMinute: 0

# Enable debug logging and less caching
debug: false

# Superadmin token (if not provided via ISBETMF_ADMIN_TOKEN / TMF_ADMIN_TOKEN)
adminToken: ""

# Enable synchronization with remote server in background
backgroudSync: false

# Special feature flags
features:
  offeringLaunchOnlyByAdmin: false
  generateIDOnCreate: false
  allowIDInBody: false
  verifyJWTSignature: false
